<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>카더라 말고</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="chat-app">
      <header class="chat-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">ㅋ</span>
          <div class="brand-copy">
            <h1>카더라 말고</h1>
            <span id="runtimeStatus" class="runtime-status">
              <span class="status-dot" aria-hidden="true"></span>
              연결 확인 중
            </span>
          </div>
        </div>
        <button id="newChatButton" class="new-chat-button" type="button">새 대화</button>
      </header>

      <main id="conversation" class="conversation" aria-live="polite" aria-label="대화 내용">
        <article class="message assistant-message">
          <div class="assistant-avatar" aria-hidden="true">ㅋ</div>
          <div class="message-content">
            <p>궁금한 내용을 물어보세요.</p>
          </div>
        </article>
      </main>

      <footer class="composer-area">
        <form id="chatForm" class="composer">
          <label class="sr-only" for="messageInput">메시지</label>
          <textarea
            id="messageInput"
            name="message"
            rows="1"
            maxlength="350"
            placeholder="메시지를 입력하세요"
            autocomplete="off"
          ></textarea>
          <button id="sendButton" class="send-button" type="submit">전송</button>
        </form>
      </footer>
    </div>

    <script src="/vendor/markdown-it/markdown-it.min.js" defer></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
